# 后端控制面监听地址
control_host: "127.0.0.1"
control_port: 8765

# 会话与热区超时设置
followup_timeout_s: 300.0

# 当前本地 LiveKit 开发所需配置，需要与 pnpm livekit:dev 使用同一组值
livekit_url: "ws://127.0.0.1:7880"
livekit_api_key: "devkey"
livekit_api_secret: "devsecret"

# 和风天气超时配置；API Host 与 API Key 都只允许通过 Console 服务密钥保存
qweather_timeout_s: 5.0

# 完整业务 Prompt 的本地人工审查文件；修改后需要重启 Backend。
prompt_audit:
  enabled: true
  output_dir: backend/data/prompt-audits
  max_runs: 20

# Background Agent 开发期终端诊断；开启后需要重启 Backend。
background_agent_terminal_diagnostics_enabled: true
